spring:
  application.name: lumina-backend
  profiles.active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lumina}
    username: ${DB_USERNAME:lumina}
    password: ${DB_PASSWORD:lumina}
    hikari: {maximum-pool-size: 20, minimum-idle: 5}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway.enabled: true
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:lumina}
    password: ${RABBITMQ_PASSWORD:lumina}
  jackson:
    serialization.write-dates-as-timestamps: false
    default-property-inclusion: non_null

lumina:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-minimum-32-characters-long}
      access-token-expiration: 900000
      refresh-token-expiration: 2592000000
    cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  rate-limit.enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet.context-path: /api
  compression.enabled: true

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.show-details: when-authorized
